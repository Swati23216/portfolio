<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swati Janawade | Developer Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            color: #333;
            line-height: 1.6;
        }
        
        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }
        
        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        
        .logo-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .logo-text .name {
            font-size: 1.5rem;
            line-height: 1;
        }
        
        .logo-text .role {
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0.9;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        nav {
            display: flex;
            gap: 2rem;
        }
        
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #fff;
            transition: width 0.3s ease;
        }
        
        nav a:hover::after {
            width: 100%;
        }
        
        /* ===== HERO SECTION ===== */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4rem 2rem;
            animation: fadeIn 1s ease;
        }
        
        .hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideDown 1s ease;
        }
        
        .hero h1 {
            font-size: 3.5rem;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        
        .hero .highlight {
            color: #ffd700;
            font-weight: 700;
        }
        
        .hero p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.95);
            max-width: 600px;
            margin-bottom: 2rem;
        }
        
        .cta-buttons {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .btn {
            background: #ffffff;
            color: #667eea;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            font-size: 1rem;
            border: 2px solid #ffffff;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }
        
        .btn.secondary {
            background: transparent;
            color: #ffffff;
        }
        
        .btn.secondary:hover {
            background: #ffffff;
            color: #667eea;
        }
        
        /* ===== FOOTER ===== */
        footer {
            background: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 2rem;
            font-weight: 500;
        }
        
        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            
            nav {
                gap: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .hero h1 {
                font-size: 2.2rem;
            }
            
            .hero p {
                font-size: 1rem;
            }
            
            .profile-img {
                width: 150px;
                height: 150px;
            }
            
            .cta-buttons {
                flex-direction: column;
                gap: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .hero h1 {
                font-size: 1.8rem;
            }
            
            .cta-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header>
        <a href="index.html" class="logo">
            <img src="C:\Users\Swati Janawade\OneDrive\Pictures\imagesjpg\sss.jpg.jpeg" alt="Swati's Logo" class="logo-img">
            <div class="logo-text">
                <div class="name">Swati</div>
                <div class="role">Portfolio</div>
            </div>
        </a>
        <nav>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero" id="home">
        <div class="hero-content">
            <img src="C:\Users\Swati Janawade\OneDrive\Pictures\imagesjpg\sss.jpg.jpeg" alt="Swati Janawade" class="profile-img">
            <div>
                <h1>Hello, I'm <span class="highlight">Swati Janawade</span></h1>
                <p>MCA Student | Python Developer | Machine Learning Enthusiast</p>
                <p style="margin-top: -1rem; font-size: 1rem; opacity: 0.9;">Building real-world applications with intelligence and innovation</p>
            </div>
            <div class="cta-buttons">
                <a href="projects.html" class="btn">View My Work</a>
                <a href="contact.html" class="btn secondary">Get In Touch</a>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 Swati Janawade | Developer Portfolio | All Rights Reserved</p>
    </footer>

</body>
</html>
